<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب | Al-Israa Law Center</title>
    <meta name="description" content="إنشاء حساب طالب جديد في منصة مركز الإسراء." />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-dark auth-page">
    <div class="auth-shell container">
      <div class="auth-card glass-card">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="شعار مركز الإسراء للحقوق" class="brand-logo" />
          <div>
            <h1>مركز الإسراء</h1>
            <p>سجل الآن وابدأ رحلتك</p>
          </div>
        </div>

        <h2>إنشاء حساب</h2>

        <form id="registerForm" class="auth-form" method="post" action="register.html">
          <div class="field-row">
            <div class="field-group">
              <label for="fullName">الاسم الكامل</label>
              <input id="fullName" name="full_name" type="text" autocomplete="name" maxlength="100" required />
            </div>
            <div class="field-group">
              <label for="academicYear">الفرقة الدراسية</label>
              <select id="academicYear" name="academic_year" required>
                <option value="1">الفرقة الأولى</option>
                <option value="2">الفرقة الثانية</option>
                <option value="3">الفرقة الثالثة</option>
                <option value="4">الفرقة الرابعة</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="faculty">الكلية والجامعة</label>
              <input id="faculty" name="faculty" type="text" autocomplete="organization" placeholder="كلية الحقوق - جامعة الزقازيق" maxlength="120" required />
            </div>
            <div class="field-group">
              <label for="phone">رقم الهاتف</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" minlength="5" maxlength="30" required />
            </div>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="email">البريد الإلكتروني</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field-group">
              <label for="password">كلمة المرور</label>
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            </div>
          </div>
          <div class="captcha-widget"></div>
          <button type="submit" class="btn btn-primary btn-block">إنشاء حساب</button>
          <p>سنرسل رابط تأكيد إلى بريدك الإلكتروني قبل تفعيل الحساب.</p>
        </form>

        <div class="auth-footer">
          <span>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
