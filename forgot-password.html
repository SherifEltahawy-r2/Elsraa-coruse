<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>استعادة كلمة المرور | Al-Israa Law Center</title>
    <meta name="description" content="استعادة كلمة المرور في منصة مركز الإسراء." />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-dark auth-page">
    <div class="auth-shell container">
      <div class="auth-card glass-card">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="شعار مركز الإسراء للحقوق" class="brand-logo" />
          <div>
            <h1>مركز الإسراء</h1>
            <p>استعادة الوصول</p>
          </div>
        </div>

        <h2>إعادة تعيين كلمة المرور</h2>

        <form id="forgotForm" class="auth-form" method="post" action="forgot-password.html">
          <div class="field-group">
            <label for="resetEmail">البريد الإلكتروني</label>
            <input id="resetEmail" name="email" type="email" autocomplete="email" placeholder="your@email.com" required />
          </div>
          <div class="captcha-widget"></div>
          <button type="submit" class="btn btn-primary btn-block">إرسال رابط الاستعادة</button>
        </form>

        <div class="auth-footer">
          <a href="login.html">العودة لتسجيل الدخول</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
