<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تعيين كلمة مرور جديدة | Al-Israa Law Center</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-dark auth-page">
    <main class="auth-shell container">
      <section class="auth-card glass-card">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="شعار مركز الإسراء للحقوق" class="brand-logo" />
          <div><h1>مركز الإسراء</h1><p>استعادة الوصول</p></div>
        </div>
        <h2>كلمة المرور الجديدة</h2>
        <form id="updatePasswordForm" class="auth-form">
          <label class="field-group">كلمة المرور الجديدة
            <input name="password" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <button type="submit" class="btn btn-primary btn-block">حفظ كلمة المرور</button>
        </form>
        <a href="login.html">العودة لتسجيل الدخول</a>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
